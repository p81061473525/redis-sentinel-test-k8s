version: '3.8'

services:
  redis-master:
    image: redis:7
    ports:
      - "6379:6379"
    command: >
      redis-server
      --port 6379
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}

  redis-replica-1:
    image: redis:7
    ports:
      - "6380:6379"
    command: >
      redis-server
      --port 6379
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --replicaof redis-master 6379
      --replica-announce-ip ${REDIS_IP}
      --replica-announce-port 6380
    depends_on:
      - redis-master

  redis-replica-2:
    image: redis:7
    ports:
      - "6381:6379"
    command: >
      redis-server
      --port 6379
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --replicaof redis-master 6379
      --replica-announce-ip ${REDIS_IP}
      --replica-announce-port 6381
    depends_on:
      - redis-master

  sentinel-1:
    image: redis:7
    ports:
      - "26379:26379"
    environment:
      - REDIS_IP=${REDIS_IP}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./sentinel-base.conf:/tmp/sentinel-base.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until redis-cli -h redis-master -p 6379 -a $REDIS_PASSWORD --no-auth-warning ping 2>/dev/null | grep -q PONG; do
          echo "waiting for redis-master..."
          sleep 1
        done
        sed "s/__REDIS_IP__/$REDIS_IP/g; s/__REDIS_PASSWORD__/$REDIS_PASSWORD/g" /tmp/sentinel-base.conf > /tmp/sentinel.conf
        echo "port 26379" >> /tmp/sentinel.conf
        echo "sentinel announce-port 26379" >> /tmp/sentinel.conf
        redis-sentinel /tmp/sentinel.conf
    depends_on:
      - redis-master

  sentinel-2:
    image: redis:7
    ports:
      - "26380:26379"
    environment:
      - REDIS_IP=${REDIS_IP}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./sentinel-base.conf:/tmp/sentinel-base.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until redis-cli -h redis-master -p 6379 -a $REDIS_PASSWORD --no-auth-warning ping 2>/dev/null | grep -q PONG; do
          echo "waiting for redis-master..."
          sleep 1
        done
        sed "s/__REDIS_IP__/$REDIS_IP/g; s/__REDIS_PASSWORD__/$REDIS_PASSWORD/g" /tmp/sentinel-base.conf > /tmp/sentinel.conf
        echo "port 26379" >> /tmp/sentinel.conf
        echo "sentinel announce-port 26380" >> /tmp/sentinel.conf
        redis-sentinel /tmp/sentinel.conf
    depends_on:
      - redis-master

  sentinel-3:
    image: redis:7
    ports:
      - "26381:26379"
    environment:
      - REDIS_IP=${REDIS_IP}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./sentinel-base.conf:/tmp/sentinel-base.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until redis-cli -h redis-master -p 6379 -a $REDIS_PASSWORD --no-auth-warning ping 2>/dev/null | grep -q PONG; do
          echo "waiting for redis-master..."
          sleep 1
        done
        sed "s/__REDIS_IP__/$REDIS_IP/g; s/__REDIS_PASSWORD__/$REDIS_PASSWORD/g" /tmp/sentinel-base.conf > /tmp/sentinel.conf
        echo "port 26379" >> /tmp/sentinel.conf
        echo "sentinel announce-port 26381" >> /tmp/sentinel.conf
        redis-sentinel /tmp/sentinel.conf
    depends_on:
      - redis-master
